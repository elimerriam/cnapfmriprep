[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnapfmriprep"
version = "0.3.1"
description = "Pydra pipeline for multi-run high-resolution 7T fMRI: XNAT DICOM to BIDS, magnitude-only NORDIC, shared TOPUP, shared-reference ANTs motion correction, and QC"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "OpenAI pipeline scaffold"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "nibabel>=5.2",
  "nitransforms>=23.0",
  "numpy>=1.26,<2.3",
  "pandas>=2.1",
  "pydantic>=2.7,<3",
  "pydicom>=2.4",
  "pydra==0.25.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
cnapfmriprep = "cnapfmriprep.cli:main"
# Transitional compatibility alias for scripts written before the rename.
seventprep = "cnapfmriprep.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cnapfmriprep = ["matlab/*.m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
